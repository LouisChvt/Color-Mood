<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Mood - Générateur de Palettes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: drift 20s infinite linear;
            pointer-events: none;
        }

        @keyframes drift {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            background: linear-gradient(45deg, #fff, #f0f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            font-weight: 300;
        }

        .mood-selector {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mood-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .moods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }

        .mood-btn {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .mood-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .mood-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .mood-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .mood-btn:active {
            transform: translateY(-1px);
        }

        .mood-btn.calme { background: linear-gradient(135deg, #89c4f4, #6bb6d6); }
        .mood-btn.energique { background: linear-gradient(135deg, #ff6b6b, #ff8e53); }
        .mood-btn.nostalgique { background: linear-gradient(135deg, #dda0dd, #d8bfd8); }
        .mood-btn.joyeux { background: linear-gradient(135deg, #ffd93d, #ffb347); }
        .mood-btn.mysterieux { background: linear-gradient(135deg, #2c3e50, #3c5a72); }
        .mood-btn.naturel { background: linear-gradient(135deg, #8bc34a, #689f38); }
        .mood-btn.elegant { background: linear-gradient(135deg, #424242, #616161); }
        .mood-btn.pastel { background: linear-gradient(135deg, #ffeaa7, #fab1a0); }
        .mood-btn.vibrant { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .mood-btn.minimaliste { background: linear-gradient(135deg, #ecf0f1, #bdc3c7); }
        .mood-btn.retro { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .mood-btn.futuriste { background: linear-gradient(135deg, #00d2ff, #3a7bd5); }

        .palette-display {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .palette-display.show {
            opacity: 1;
            transform: translateY(0);
        }

        .palette-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .palette-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-regenerate {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-regenerate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-export {
            background: #f0f0f0;
            color: #333;
        }

        .btn-export:hover {
            background: #e0e0e0;
        }

        .colors-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .color-card {
            position: relative;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: colorAppear 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes colorAppear {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .color-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .color-display {
            width: 100%;
            height: 70%;
            position: relative;
            overflow: hidden;
        }

        .color-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 1rem;
            height: 30%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .color-hex {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 1rem;
            color: #333;
        }

        .copy-icon {
            width: 20px;
            height: 20px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .color-card:hover .copy-icon {
            opacity: 1;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .moods-grid {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            }

            .mood-btn {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            .colors-container {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Color Mood</h1>
            <p class="subtitle">Générez des palettes de couleurs inspirées par vos émotions</p>
        </header>

        <div class="mood-selector">
            <h2 class="mood-title">Choisissez une humeur</h2>
            <div class="moods-grid">
                <button class="mood-btn calme" data-mood="calme">🌊 Calme</button>
                <button class="mood-btn energique" data-mood="energique">⚡ Énergique</button>
                <button class="mood-btn nostalgique" data-mood="nostalgique">🌅 Nostalgique</button>
                <button class="mood-btn joyeux" data-mood="joyeux">😊 Joyeux</button>
                <button class="mood-btn mysterieux" data-mood="mysterieux">🌙 Mystérieux</button>
                <button class="mood-btn naturel" data-mood="naturel">🌿 Naturel</button>
                <button class="mood-btn elegant" data-mood="elegant">💎 Élégant</button>
                <button class="mood-btn pastel" data-mood="pastel">🦄 Pastel</button>
                <button class="mood-btn vibrant" data-mood="vibrant">🎨 Vibrant</button>
                <button class="mood-btn minimaliste" data-mood="minimaliste">⚪ Minimaliste</button>
                <button class="mood-btn retro" data-mood="retro">📻 Rétro</button>
                <button class="mood-btn futuriste" data-mood="futuriste">🚀 Futuriste</button>
            </div>
        </div>

        <div class="palette-display" id="paletteDisplay">
            <div class="palette-header">
                <h3 class="palette-name" id="paletteName">Votre palette</h3>
                <div class="action-buttons">
                    <button class="btn-action btn-regenerate" id="regenerateBtn">
                        🔄 Régénérer
                    </button>
                    <button class="btn-action btn-export" id="exportBtn">
                        📥 Exporter
                    </button>
                </div>
            </div>
            <div class="colors-container" id="colorsContainer"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const palettes = {
            calme: [
                ['#E3F2FD', '#90CAF9', '#42A5F5', '#1E88E5', '#0D47A1'],
                ['#E0F2F1', '#80CBC4', '#26A69A', '#00897B', '#004D40'],
                ['#F3E5F5', '#CE93D8', '#AB47BC', '#7B1FA2', '#4A148C']
            ],
            energique: [
                ['#FFF3E0', '#FFCC80', '#FF9800', '#F57C00', '#E65100'],
                ['#FFEBEE', '#EF9A9A', '#E57373', '#F44336', '#C62828'],
                ['#FFF9C4', '#FFF176', '#FFEB3B', '#FDD835', '#F57F17']
            ],
            nostalgique: [
                ['#F3E5F5', '#E1BEE7', '#CE93D8', '#BA68C8', '#9C27B0'],
                ['#FCE4EC', '#F8BBD0', '#F48FB1', '#F06292', '#E91E63'],
                ['#E8EAF6', '#9FA8DA', '#7986CB', '#5C6BC0', '#3949AB']
            ],
            joyeux: [
                ['#FFF8E1', '#FFECB3', '#FFD54F', '#FFC107', '#FF8F00'],
                ['#F9FBE7', '#F0F4C3', '#E6EE9C', '#DCE775', '#CDDC39'],
                ['#FFFDE7', '#FFF9C4', '#FFF59D', '#FFF176', '#FFEE58']
            ],
            mysterieux: [
                ['#263238', '#37474F', '#455A64', '#546E7A', '#607D8B'],
                ['#212121', '#424242', '#616161', '#757575', '#9E9E9E'],
                ['#311B92', '#4527A0', '#512DA8', '#5E35B1', '#673AB7']
            ],
            naturel: [
                ['#E8F5E9', '#A5D6A7', '#66BB6A', '#4CAF50', '#2E7D32'],
                ['#F1F8E9', '#DCEDC8', '#C5E1A5', '#AED581', '#9CCC65'],
                ['#EFEBE9', '#D7CCC8', '#BCAAA4', '#A1887F', '#795548']
            ],
            elegant: [
                ['#FAFAFA', '#F5F5F5', '#EEEEEE', '#E0E0E0', '#BDBDBD'],
                ['#ECEFF1', '#CFD8DC', '#B0BEC5', '#90A4AE', '#607D8B'],
                ['#2C3E50', '#34495E', '#7F8C8D', '#95A5A6', '#BDC3C7']
            ],
            pastel: [
                ['#FFE5E5', '#FFD3E1', '#FFDFBA', '#FFFFBA', '#BAFFC9'],
                ['#E5CCFF', '#D4A5FF', '#B19AFF', '#92B4FF', '#92E5FF'],
                ['#FFEAA7', '#FAB1A0', '#FF7979', '#BADC58', '#7ED6DF']
            ],
            vibrant: [
                ['#FF006E', '#FB5607', '#FFBE0B', '#8338EC', '#3A86FF'],
                ['#F72585', '#B5179E', '#7209B7', '#560BAD', '#480CA8'],
                ['#FF4365', '#00D9FF', '#FFFD82', '#FF60A8', '#C1FF72']
            ],
            minimaliste: [
                ['#FFFFFF', '#F8F9FA', '#E9ECEF', '#DEE2E6', '#CED4DA'],
                ['#F5F5F5', '#E0E0E0', '#BDBDBD', '#9E9E9E', '#757575'],
                ['#FAFAFA', '#F0F0F0', '#E8E8E8', '#D3D3D3', '#C0C0C0']
            ],
            retro: [
                ['#FF6B35', '#F7931E', '#FDC830', '#02B3A3', '#026670'],
                ['#E63946', '#F1FAEE', '#A8DADC', '#457B9D', '#1D3557'],
                ['#264653', '#2A9D8F', '#E9C46A', '#F4A261', '#E76F51']
            ],
            futuriste: [
                ['#00F5FF', '#00D9FF', '#00BFFF', '#0080FF', '#0040FF'],
                ['#FF00FF', '#FF00BF', '#FF0080', '#FF0040', '#FF0000'],
                ['#00FFFF', '#00E5E5', '#00CCCC', '#00B2B2', '#009999']
            ]
        };

        let currentMood = null;
        let currentPalette = [];

        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                createRipple(e, this);
                generatePalette(this.dataset.mood);
            });
        });

        function createRipple(e, element) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            element.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        }

        function generatePalette(mood) {
            currentMood = mood;
            const moodPalettes = palettes[mood];
            currentPalette = moodPalettes[Math.floor(Math.random() * moodPalettes.length)];
            
            displayPalette();
        }

        function displayPalette() {
            const paletteDisplay = document.getElementById('paletteDisplay');
            const paletteName = document.getElementById('paletteName');
            const colorsContainer = document.getElementById('colorsContainer');
            
            paletteName.textContent = `Palette ${currentMood.charAt(0).toUpperCase() + currentMood.slice(1)}`;
            
            colorsContainer.innerHTML = '';
            
            currentPalette.forEach((color, index) => {
                setTimeout(() => {
                    const colorCard = createColorCard(color);
                    colorsContainer.appendChild(colorCard);
                }, index * 100);
            });
            
            paletteDisplay.classList.add('show');
        }

        function createColorCard(color) {
            const card = document.createElement('div');
            card.className = 'color-card';
            card.style.animationDelay = '0s';
            
            const display = document.createElement('div');
            display.className = 'color-display';
            display.style.background = color;
            
            const info = document.createElement('div');
            info.className = 'color-info';
            
            const hex = document.createElement('span');
            hex.className = 'color-hex';
            hex.textContent = color.toUpperCase();
            
            const copyIcon = document.createElement('svg');
            copyIcon.className = 'copy-icon';
            copyIcon.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            `;
            
            info.appendChild(hex);
            info.appendChild(copyIcon);
            
            card.appendChild(display);
            card.appendChild(info);
            
            card.addEventListener('click', () => copyColor(color));
            
            return card;
        }

        function copyColor(color) {
            navigator.clipboard.writeText(color.toUpperCase()).then(() => {
                showToast(`Couleur ${color.toUpperCase()} copiée !`);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        document.getElementById('regenerateBtn').addEventListener('click', () => {
            if (currentMood) {
                generatePalette(currentMood);
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (currentPalette.length > 0) {
                const paletteText = currentPalette.map(c => c.toUpperCase()).join(', ');
                navigator.clipboard.writeText(paletteText).then(() => {
                    showToast('Palette exportée dans le presse-papiers !');
                });
            }
        });

        // Animation initiale
        document.querySelectorAll('.mood-btn').forEach((btn, index) => {
            btn.style.animation = `fadeInUp 0.5s ease-out ${index * 0.05}s forwards`;
            btn.style.opacity = '0';
        });

        setTimeout(() => {
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.style.opacity = '1';
            });
        }, 1000);
    </script>
</body>
</html>
